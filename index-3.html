<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusGo</title>
<style>
:root{color-scheme:light dark}
body{margin:0}
/* Layout: шапка-полоса + одна колонка 760px: список -> карточка -> форма заявки */
:root{--bg:#f3f5fa;--fg:#1b2233;--muted:#5a6479;--card:#ffffff;--line:#dde2ee;--accent:#2f4fd8;--on-accent:#ffffff;--err:#b00020;--ok:#1b7f3b;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--fg:#e8ecf6;--muted:#9aa5bd;--card:#18202f;--line:#2a3347;--accent:#7b93ff;--on-accent:#0f1420;--err:#ff8a9b;--ok:#5fd68a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--fg:#e8ecf6;--muted:#9aa5bd;--card:#18202f;--line:#2a3347;--accent:#7b93ff;--on-accent:#0f1420;--err:#ff8a9b;--ok:#5fd68a;color-scheme:dark}
body{font-family:var(--font);background:var(--bg);color:var(--fg);line-height:1.5;font-size:16px}
header{background:var(--accent);color:var(--on-accent);padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header h1{margin:0;font-size:1.6rem}
main{max-width:760px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2{text-wrap:balance}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;overflow-wrap:anywhere}
.card h3{margin:0 0 6px}
button{background:var(--accent);color:var(--on-accent);border:0;border-radius:6px;padding:10px 16px;cursor:pointer;font:inherit;font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
label{display:block;margin:10px 0 4px}
input{width:100%;padding:9px;box-sizing:border-box;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px}
.err{color:var(--err);margin-top:8px;overflow-wrap:anywhere}
.ok{color:var(--ok);font-weight:700;margin-top:10px;overflow-wrap:anywhere}
.hint{color:var(--muted);font-size:.85rem;margin-top:12px}
</style>
</head>
<body>
<header><h1 style="margin:0">CampusGo</h1><div>Мероприятия колледжа</div></header>
<main>
  <section id="listView">
    <h2>Ближайшие мероприятия</h2>
    <div id="list"></div>
  </section>

  <section id="detailView" hidden>
    <button id="backBtn" type="button">← К списку</button>
    <div class="card" id="detail"></div>
    <div class="card">
      <h3>Заявка на участие</h3>
      <form id="form" novalidate>
        <label for="name">Имя и фамилия *</label>
        <input id="name" name="name" type="text">
        <label for="group">Группа</label>
        <input id="group" name="group" type="text">
        <label for="contact">Контакт (телефон или e-mail) *</label>
        <input id="contact" name="contact" type="text">
        <div style="margin-top:12px"><button id="submitBtn" type="submit">Отправить заявку</button></div>
        <div id="error" class="err"></div>
        <div id="success" class="ok"></div>
      </form>
    </div>
  </section>
<p class="hint">Учебный MVP: заявки не сохраняются и никуда не отправляются.</p>
</main>
<script>
// Тестовые данные (технический долг TD-01: данные записаны в коде)
const events = [
  {id:1, title:"День открытых дверей", date:"15.11.2026", place:"Актовый зал, корпус 1", description:"Знакомство с колледжем, специальностями и студенческими клубами."},
  {id:2, title:"Хакатон «Код кампуса»", date:"22.11.2026", place:"Компьютерный класс 305", description:"Командное соревнование: за 6 часов нужно собрать прототип сервиса."},
  {id:3, title:"Спортивный турнир по волейболу", date:"29.11.2026", place:"Спортивный зал", description:"Турнир между группами колледжа. Команды по 6 человек."},
  {id:4, title:"Вечер настольных игр", date:"05.12.2026", place:"Библиотека, 2 этаж", description:"Неформальная встреча студентов, игры и чай."}
];
let current = null;

function renderList(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  events.forEach(e => {
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = '<h3>'+e.title+'</h3><div>Дата: '+e.date+'</div><div>Место: '+e.place+'</div>'+
      '<div style="margin-top:8px"><button type="button" data-id="'+e.id+'" class="openBtn">Подробнее</button></div>';
    list.appendChild(d);
  });
  document.querySelectorAll('.openBtn').forEach(b => b.addEventListener('click', () => openEvent(+b.dataset.id)));
}
function openEvent(id){
  current = events.find(e => e.id === id);
  document.getElementById('detail').innerHTML =
    '<h2 id="detailTitle">'+current.title+'</h2><div>Дата: <span id="dDate">'+current.date+'</span></div>'+
    '<div>Место: <span id="dPlace">'+current.place+'</span></div><p id="dDesc">'+current.description+'</p>';
  document.getElementById('form').reset();
  document.getElementById('error').textContent = '';
  document.getElementById('success').textContent = '';
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('listView').hidden=true;
  document.getElementById('detailView').hidden=false;
}
function backToList(){
  document.getElementById('detailView').hidden=true;
  document.getElementById('listView').hidden=false;
}
document.getElementById('backBtn').addEventListener('click', backToList);
document.getElementById('form').addEventListener('submit', function(ev){
  ev.preventDefault();
  const name = document.getElementById('name').value.trim();
  const contact = document.getElementById('contact').value.trim();
  const err = document.getElementById('error');
  const ok = document.getElementById('success');
  err.textContent = ''; ok.textContent = '';
  if (!name || !contact){
    err.textContent = 'Заполните обязательные поля: имя и контакт.';
    return;
  }
  // Демонстрация: данные никуда не отправляются (TD-02)
  document.getElementById('submitBtn').disabled = true; // защита от повторной отправки
  ok.textContent = 'Заявка на «'+current.title+'» отправлена. Спасибо, '+name+'!';
});
renderList();
</script>

</body>
</html>
